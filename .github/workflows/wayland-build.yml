name: Wayland
on:
  push:
    branches:
    - "main"
    - "core-9-1-branch"
    - "wayland"
    tags:
    - "core-*"
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: tk/unix
env:
  ERROR_ON_FAILURES: 1
  GLFW_VERSION: "3.4"
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - "gcc"
          - "clang"
        config:
          - ""
          - "CFLAGS=-DTK_NO_DEPRECATED=1"
          - "--disable-shared"
          - "--enable-symbols"
    steps:
      - name: Checkout Tk
        uses: actions/checkout@v7
        with:
          path: tk
      - name: Checkout Tcl 9.1
        uses: actions/checkout@v7
        with:
          repository: tcltk/tcl
          ref: main
          path: tcl
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wayland-protocols libwayland-dev libwayland-egl1 \
            libxkbcommon-dev libgles2-mesa-dev \
            libdecor-0-dev libfontconfig-dev libsystemd-dev \
            libharfbuzz-dev libspeechd-dev wl-clipboard libcups2-dev \
            libatk1.0-dev libatk-bridge2.0-dev
          mkdir "$HOME/install dir"
          touch tk/doc/man.macros tk/generic/tkStubInit.c
          echo "CFGOPT=--enable-wayland $CFGOPT" >> $GITHUB_ENV
          echo "CC=$COMPILER" >> $GITHUB_ENV
          echo "TOOL_DIR=$(cd tcl/tools;pwd)" >> $GITHUB_ENV
          echo "BUILD_CONFIG_ID=$OPTS" >> $GITHUB_ENV
        working-directory: "."
        env:
          CFGOPT: ${{ matrix.config }}
          COMPILER: ${{ matrix.compiler }}
          OPTS: ${{ matrix.compiler }}${{ matrix.config }}
      - name: Cache GLFW ${{ env.GLFW_VERSION }}
        id: glfw-cache
        uses: actions/cache@v4
        with:
          path: ~/glfw-install
          key: glfw-${{ env.GLFW_VERSION }}-ubuntu-24.04-wayland-v1
      - name: Build GLFW ${{ env.GLFW_VERSION }}
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        # Ubuntu 24.04 ships GLFW 3.3.x; the Wayland backend needs >= 3.4
        # (GLFW_PLATFORM, GLFW_SCALE_FRAMEBUFFER, GLFW_WAYLAND_APP_ID).
        run: |
          set -e
          sudo apt-get install -y cmake pkg-config
          curl -fsSL -o "$RUNNER_TEMP/glfw.tar.gz" \
            "https://github.com/glfw/glfw/archive/refs/tags/${GLFW_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/glfw.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/glfw-${GLFW_VERSION}" -B "$RUNNER_TEMP/glfw-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/glfw-install" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/glfw-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/glfw-build"
        working-directory: "."
      - name: Use GLFW ${{ env.GLFW_VERSION }}
        run: |
          echo "PKG_CONFIG_PATH=$HOME/glfw-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/glfw-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
          export PKG_CONFIG_PATH="$HOME/glfw-install/lib/pkgconfig"
          echo "GLFW version: $(pkg-config --modversion glfw3)"
          pkg-config --atleast-version=3.4 glfw3 || { echo "::error::GLFW < 3.4"; exit 1; }
        working-directory: "."
      - name: Configure and Build Tcl
        run: |
          ./configure "--prefix=$HOME/install dir" || { cat config.log; exit 1; }
          make all install || exit 1
          echo "TCL_CONFIG_PATH=`pwd`" >> $GITHUB_ENV
        working-directory: tcl/unix
      - name: Configure
        run: |
          ./configure $CFGOPT --with-tcl=$TCL_CONFIG_PATH "--prefix=$HOME/install dir" || { cat config.log; exit 1; }
      - name: Build
        run: make binaries libraries
      - name: Build Test Harness
        run: make tktest

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc"]
        config: ["", "--enable-symbols"]
    name: test (${{ matrix.compiler }}, ${{ matrix.config || 'default' }})
    steps:
      - name: Checkout Tk
        uses: actions/checkout@v7
        with:
          path: tk
      - name: Checkout Tcl 9.1
        uses: actions/checkout@v7
        with:
          repository: tcltk/tcl
          ref: main
          path: tcl
      - name: Setup Environment
        run: |
          sudo apt-get update
          # gnome-shell: headless Wayland compositor + org.freedesktop.Notifications
          # gnome-shell-extension-appindicator: org.kde.StatusNotifierWatcher + Host
          # libglib2.0-bin / dconf: gsettings, used to enable the extension
          sudo apt-get install -y \
            wayland-protocols libwayland-dev libwayland-egl1 \
            libxkbcommon-dev libgles2-mesa-dev \
            libdecor-0-dev libfontconfig-dev libsystemd-dev \
            libharfbuzz-dev libspeechd-dev wl-clipboard libcups2-dev \
            libicu-dev xfonts-75dpi xfonts-100dpi xfonts-scalable libxfont2 unifont \
            dbus dbus-x11 mesa-utils \
            gnome-shell gnome-shell-extension-appindicator gnome-shell-common \
            libglib2.0-bin dconf-gsettings-backend dconf-service \
            libatk1.0-dev libatk-bridge2.0-dev
          mkdir "$HOME/install dir"
          touch tk/doc/man.macros tk/generic/tkStubInit.c
          echo "CFGOPT=--enable-wayland $CFGOPT" >> $GITHUB_ENV
          echo "CC=$COMPILER" >> $GITHUB_ENV
        working-directory: "."
        env:
          CFGOPT: ${{ matrix.config }}
          COMPILER: ${{ matrix.compiler }}
      - name: Cache GLFW ${{ env.GLFW_VERSION }}
        id: glfw-cache
        uses: actions/cache@v4
        with:
          path: ~/glfw-install
          key: glfw-${{ env.GLFW_VERSION }}-ubuntu-24.04-wayland-v1
      - name: Build GLFW ${{ env.GLFW_VERSION }}
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        # Ubuntu 24.04 ships GLFW 3.3.x; the Wayland backend needs >= 3.4
        # (GLFW_PLATFORM, GLFW_SCALE_FRAMEBUFFER, GLFW_WAYLAND_APP_ID).
        run: |
          set -e
          sudo apt-get install -y cmake pkg-config
          curl -fsSL -o "$RUNNER_TEMP/glfw.tar.gz" \
            "https://github.com/glfw/glfw/archive/refs/tags/${GLFW_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/glfw.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/glfw-${GLFW_VERSION}" -B "$RUNNER_TEMP/glfw-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/glfw-install" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/glfw-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/glfw-build"
        working-directory: "."
      - name: Use GLFW ${{ env.GLFW_VERSION }}
        run: |
          echo "PKG_CONFIG_PATH=$HOME/glfw-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/glfw-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
          export PKG_CONFIG_PATH="$HOME/glfw-install/lib/pkgconfig"
          echo "GLFW version: $(pkg-config --modversion glfw3)"
          pkg-config --atleast-version=3.4 glfw3 || { echo "::error::GLFW < 3.4"; exit 1; }
        working-directory: "."
      - name: Configure and Build Tcl
        run: |
          ./configure "--prefix=$HOME/install dir" || { cat config.log; exit 1; }
          make all install || exit 1
          echo "TCL_CONFIG_PATH=`pwd`" >> $GITHUB_ENV
        working-directory: tcl/unix
      - name: Configure
        run: |
          ./configure $CFGOPT --with-tcl=$TCL_CONFIG_PATH "--prefix=$HOME/install dir" || { cat config.log; exit 1; }
      - name: Build
        run: make binaries libraries tktest || exit 1
      - name: Run Tests
        # Replaces unix/run_wayland_tests. Runs in tk/unix (see defaults above).
        # GitHub's default "bash -e -o pipefail" is relaxed below so that a failing
        # classic suite doesn't skip the ttk suite; the grep gates at the end decide.
        run: |
          set -eu
          set +o pipefail

          TK_UNIX=$(pwd)
          ROOT=$(cd "$TK_UNIX/.." && pwd)
          [ -x "$TK_UNIX/tktest" ] || { echo "tktest not found in $TK_UNIX" >&2; ls -la >&2; exit 1; }

          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=swrast
          export XKB_DEFAULT_LAYOUT=us
          export MUTTER_DEBUG_DUMMY_MODE_SPECS=1280x720

          # Isolated HOME / XDG dirs so nothing leaks in from the runner image
          SCRATCH="${RUNNER_TEMP:-/tmp}/xdg-$$"
          mkdir -p "$SCRATCH/home" "$SCRATCH/cache" "$SCRATCH/config"
          export HOME="$SCRATCH/home"
          export XDG_CONFIG_HOME="$SCRATCH/config"
          export XDG_CACHE_HOME="$SCRATCH/cache"
          export XDG_DATA_DIRS="/usr/share:/usr/local/share"
          export GIO_USE_VFS=local
          export GVFS_DISABLE_FUSE=1

          export XDG_RUNTIME_DIR="${RUNNER_TEMP:-/tmp}/run-$$"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          rm -f "$XDG_RUNTIME_DIR"/wayland-*

          LOG_DIR="${RUNNER_TEMP:-/tmp}/wl-logs"
          mkdir -p "$LOG_DIR"

          # Session bus (needed for SNI + notifications)
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID

          COMPOSITOR_PID=""
          cleanup() {
            rc=$?
            [ -n "$COMPOSITOR_PID" ] && kill "$COMPOSITOR_PID" 2>/dev/null || true
            [ -n "${DBUS_SESSION_BUS_PID:-}" ] && kill "$DBUS_SESSION_BUS_PID" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then
              for f in "$LOG_DIR"/*.log; do
                [ -s "$f" ] && { echo "::group::tail of $f"; tail -n 80 "$f"; echo "::endgroup::"; }
              done
            fi
            rm -rf "$SCRATCH" "$XDG_RUNTIME_DIR"
          }
          trap cleanup EXIT INT TERM

          # wait_name <dbus-name> <tries (0.5s each)>
          wait_name() {
            for _ in $(seq 1 "$2"); do
              dbus-send --session --dest=org.freedesktop.DBus --type=method_call --print-reply \
                /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner "string:$1" 2>/dev/null \
                | grep -q "boolean true" && return 0
              sleep 0.5
            done
            return 1
          }

          echo "::group::Starting gnome-shell headless (1280x720) + AppIndicator extension"
          # Enable the extension before the shell starts so it loads at startup
          gsettings set org.gnome.shell disable-user-extensions false
          gsettings set org.gnome.shell enabled-extensions "['appindicatorsupport@rgcjonas.gmail.com']"
          export XDG_CURRENT_DESKTOP=GNOME
          export XDG_SESSION_TYPE=wayland
          gnome-shell --headless --wayland --no-x11 \
            --virtual-monitor 1280x720 --wayland-display wayland-test \
            >"$LOG_DIR/gnome-shell.log" 2>&1 &
          COMPOSITOR_PID=$!

          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/wayland-test" ] && break
            kill -0 "$COMPOSITOR_PID" 2>/dev/null || { echo "gnome-shell exited early" >&2; exit 1; }
            sleep 0.1
          done
          [ -S "$XDG_RUNTIME_DIR/wayland-test" ] || {
            echo "gnome-shell failed to create socket" >&2
            ls -l "$XDG_RUNTIME_DIR" >&2
            exit 1
          }
          export WAYLAND_DISPLAY=wayland-test
          echo "Using WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          echo "::endgroup::"

          echo "::group::Waiting for SNI watcher + Notifications"
          if ! wait_name org.kde.StatusNotifierWatcher 60; then
            echo "::error::StatusNotifierWatcher never appeared (AppIndicator extension not loaded?)"
            gnome-extensions list --enabled 2>&1 || true
            gnome-extensions info appindicatorsupport@rgcjonas.gmail.com 2>&1 || true
            exit 1
          fi
          wait_name org.freedesktop.Notifications 20 || echo "::warning::no Notifications service"
          dbus-send --session --type=method_call --print-reply --dest=org.freedesktop.DBus \
            /org/freedesktop/DBus org.freedesktop.DBus.ListNames | grep -E "StatusNotifier|Notifications" || true
          echo "::endgroup::"

          # Use the source-built Tcl
          export LD_LIBRARY_PATH="$TK_UNIX:$TCL_CONFIG_PATH:${LD_LIBRARY_PATH:-}"
          export TCL_LIBRARY="$TCL_CONFIG_PATH/../library"
          export TK_LIBRARY="$ROOT/library"

          ./tktest ../tests/all.tcl -singleproc 1 | tee out-classic.txt
          ./tktest ../tests/ttk/all.tcl -singleproc 1 | tee out-ttk.txt
          grep -q "Failed     0" out-classic.txt
          grep -q "Failed     0" out-ttk.txt
        timeout-minutes: 15
